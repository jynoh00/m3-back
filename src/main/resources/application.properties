spring.application.name=community

# DB 데이터소스
spring.datasource.url=jdbc:mysql://m3-mysql.cvu62c46qis5.ap-northeast-2.rds.amazonaws.com:3306/m3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=m3_app
spring.datasource.password=${DB_PASSWORD}

# (선택) SQL 로그 확인
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
spring.jpa.open-in-view=false

spring.config.import=optional:file:./.env[.properties]
jwt.secret=${JWT_SECRET}
jwt.access-token-expire-minutes=30
jwt.refresh-token-expire-days=7

# CORS 허용 오리진 (FE)
cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:5173,http://127.0.0.1:5173

# 이미지 로컬 저장 경로, 업로드 제한
file.upload-dir=./uploads/users
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB