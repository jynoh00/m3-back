name: Deploy Backend

on:
  push:
    branches: ["main"]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/m3-back

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: m3
          MYSQL_USER: m3_app
          MYSQL_PASSWORD: test1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: JDK 26 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "26"

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 스키마 적용
        run: mysql -h 127.0.0.1 -P 3306 -u root -proot m3 < src/main/resources/schema.sql

      - name: 빌드 & 테스트
        run: ./gradlew build
        env:
          JWT_SECRET: ci-test-dummy-secret-value-not-used-in-production
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/m3?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          SPRING_DATASOURCE_USERNAME: m3_app
          SPRING_DATASOURCE_PASSWORD: test1234

  build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: 이미지 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: EC2에 SSH로 접속하여 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app
            docker compose pull backend
            docker compose up -d backend
            docker image prune -f